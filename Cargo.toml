[package]
name = "butil"
version = "0.0.2"
edition = "2024"

[lib]
name = "butil"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"], optional = true }
async-trait = { version = "0.1.91", optional = true }
tokio-util = { version = "0.7.19", optional = true }
tokio = { version = "1.53.1", features = [
  "sync",
  "rt",
  "macros",
  "time",
], optional = true }
tokio-stream = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }
atomic_enum = { version = "0.3.0", optional = true }
prost = { version = "0.14", optional = true }
chrono = { version = "0.4", optional = true }
uuid = { version = "1.24.0", features = ["v4", "serde"], optional = true }
minijinja = { version = "2", optional = true }
toml = { version = "1.1.4", optional = true }
sea-orm = { version = "2.0.1", features = [
  "sqlx-postgres",
  "sqlx-sqlite",
  "runtime-tokio-rustls",
], optional = true }
lettre = { version = "0.11.23", default-features = false, features = [
  "tokio1-rustls",
  "builder",
  "smtp-transport",
  "rustls-native-certs",
  "aws-lc-rs",
  "file-transport",
], optional = true }
redis = { version = "1.8.0", features = [
  "tokio-comp",
  "aio",
  "connection-manager",
], optional = true }
object_store = { version = "0.13", features = ["aws"], optional = true }

[features]
default = []
async-utils = ["dep:tokio", "dep:tokio-util"]
collections = ["dep:serde", "dep:prost"]
actor = [
  "async-utils",
  "collections",
  "dep:async-trait",
  "dep:tokio-stream",
  "dep:futures",
  "dep:atomic_enum",
  "dep:chrono",
  "dep:uuid",
]
server-config = [
  "server-config-loader",
  "server-config-db",
  "server-config-fixture",
  "server-config-mail",
  "server-config-storage",
  "server-config-aws",
]
server-config-loader = ["dep:serde", "dep:minijinja"]
server-config-db = ["dep:serde", "dep:sea-orm"]
server-config-fixture = [
  "server-config-db",
  "dep:toml",
  "dep:async-trait",
]
server-config-mail = [
  "actor",
  "dep:serde",
  "dep:minijinja",
  "dep:lettre",
  "tokio/fs",
]
server-config-storage = [
  "dep:serde",
  "dep:async-trait",
  "dep:tokio",
  "tokio/fs",
  "tokio/io-util",
]
server-config-aws = [
  "server-config-storage",
  "dep:object_store",
  "dep:uuid",
  "tokio-util/io",
]
distrib = [
  "actor",
  "dep:redis",
  "dep:prost",
  "dep:uuid",
  "dep:tokio",
  "dep:tokio-stream",
]