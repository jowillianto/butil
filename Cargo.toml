[package]
name = "butil"
version = "0.1.0"
edition = "2024"

[lib]
name = "butil"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
async-trait = { version = "0.1.89" }
tokio-util = { version = "0.7.18" }
tokio = { version = "1.52.3", features = ["sync", "rt", "macros", "time"] }
tokio-stream = { version = "0.1" }
futures = "0.3"
butil-macro = { path = "macro" }
atomic_enum = "0.3.0"
regex = "1"
prost = "0.14"
uuid = { version = "1.23.5", features = ["v4", "serde"], optional = true }
chrono = { version = "0.4", optional = true }
serde_json = { version = "1.0.150", optional = true }
argon2 = { version = "0.5.3", optional = true }
js-sys = { version = "0.3", optional = true }

[dependencies.sea-orm]
version = "2.0.0-rc.42"
optional = true
features = [
  "sqlx-postgres",
  "sqlx-sqlite",
  "runtime-tokio-rustls",
]

[dependencies.lettre]
version = "0.11.22"
default-features = false
optional = true
features = [
  "tokio1-rustls",
  "builder",
  "smtp-transport",
  "rustls-native-certs",
  "aws-lc-rs",
  "file-transport"
]

[dependencies.redis]
version = "1"
optional = true
features = ["tokio-rustls-comp", "aio"]

[features]
default = []

db = ["db-pg", "db-sqlite"]
db-pg = [
  "sea-orm/sqlx-postgres",
  "db-base"
]
db-sqlite = [
  "sea-orm/sqlx-sqlite",
  "db-base"
]
db-base = [
  "sea-orm/runtime-tokio-rustls"
]

mail = [
  "mail-smtp",
  "mail-file"
]
mail-file = [
  "lettre/file-transport",
  "mail-base"
]
mail-smtp = [
  "lettre/smtp-transport",
  "lettre/rustls-native-certs",
  "lettre/aws-lc-rs",
  "mail-base"
]
mail-base = [
  "lettre/tokio1-rustls"
]

cache-store = [
  "cache-store-redis",
  "cache-store-memory"
]
cache-store-redis = ["dep:redis", "cache-store-base"]
cache-store-memory = ["cache-store-base"]
cache-store-base = ["dep:chrono", "dep:serde_json"]

storage = [
  "storage-local"
]
storage-local = ["storage-base"]
storage-base = []


hashing = ["dep:argon2"]
tokio = ["dep:uuid"]
actor-redis = ["tokio", "dep:redis", "dep:serde_json"]
js = ["dep:js-sys"]
